<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>돈 화분</title>
    <meta name="description" content="화분에 100원을 심고 물을 주면 5만 원까지 자라요. 쭉 뽑아서 1억을 모으는 방치형 미니게임." />
    <meta name="theme-color" content="#173a2c" />
    <!-- 이 게임은 밝은 화면 하나로 디자인했다. 크롬의 자동 다크 모드와 Dark Reader가 색을 뒤집지 않게 막는다. -->
    <meta name="color-scheme" content="only light" />
    <meta name="darkreader-lock" />
    <script>
      // 카카오톡·인스타그램·스레드 같은 앱 안의 브라우저로 열리면 기본 브라우저로 다시 연다.
      // 앱 안의 브라우저에 쌓인 진행 상황은 기본 브라우저와 이어지지 않기 때문이다.
      // 앱마다 바깥으로 여는 방법이 달라서 하나씩 나눠 둔다. 실패하면 게임 화면에 안내가 뜬다.
      ;(function () {
        var ua = navigator.userAgent || ''
        if (window.top !== window.self || !/^https?:$/.test(location.protocol)) return
        var app = /KAKAOTALK/i.test(ua)
          ? '카카오톡'
          : /Instagram/i.test(ua)
            ? '인스타그램'
            : /Barcelona/i.test(ua)
              ? '스레드'
              : /FBAN|FBAV|FB_IAB/i.test(ua)
                ? '페이스북'
                : /\bLine\//i.test(ua)
                  ? '라인'
                  : /NAVER\(inapp|DaumApps|everytimeApp|BAND\/|KAKAOSTORY|musical_ly|BytedanceWebview|Snapchat/i.test(ua) ||
                      /Android.*; wv\)/i.test(ua)
                    ? '앱'
                    : null
        if (!app) return
        var url = location.origin + location.pathname + location.search
        window.__inApp = app
        window.__openExternal = function () {
          if (app === '카카오톡') {
            location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url)
          } else if (app === '라인') {
            location.href = url + (location.search ? '&' : '?') + 'openExternalBrowser=1'
          } else if (/Android/i.test(ua)) {
            // 안드로이드: 기본 브라우저로 여는 인텐트 주소
            location.href =
              'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;action=android.intent.action.VIEW;end'
          } else if (/iPhone|iPad|iPod/i.test(ua)) {
            // 아이폰: 사파리로 여는 주소(iOS 17부터). 안 되는 앱에서는 안내가 뜬다.
            location.href = 'x-safari-' + url
          }
        }
        if (!/openExternalBrowser=1/.test(location.search)) window.__openExternal()
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- 공유 미리보기. 주소는 GitHub Pages 기준이라 저장소 이름이 바뀌면 함께 고친다. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="돈 화분" />
    <meta property="og:description" content="100원을 심어 1억까지 키우는 방치형 미니게임" />
    <meta property="og:url" content="https://edibulb.github.io/money-pot/" />
    <meta property="og:image" content="https://edibulb.github.io/money-pot/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
